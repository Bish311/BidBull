services:
  postgres:
    image: postgres:16-alpine
    container_name: bidbull-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bidbull
      POSTGRES_PASSWORD: bidbull
      POSTGRES_DB: bidbull
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidbull -d bidbull"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: bidbull-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidbull-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://bidbull:bidbull@postgres:5432/bidbull
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: secure_bidbull_secret_key_production_ready_value
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bidbull-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_HOST: localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
