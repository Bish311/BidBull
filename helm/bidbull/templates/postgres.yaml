apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bidbull-postgres-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bidbull-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: bidbull-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bidbull-postgres
  template:
    metadata:
      labels:
        app: bidbull-postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          ports:
            - containerPort: {{ .Values.postgres.port }}
              name: postgres
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: bidbull-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bidbull-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: bidbull-postgres
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    app: bidbull-postgres
