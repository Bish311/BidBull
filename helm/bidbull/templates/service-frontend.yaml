apiVersion: v1
kind: Service
metadata:
  name: bidbull-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: bidbull-frontend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: bidbull-frontend
