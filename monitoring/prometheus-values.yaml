server:
  global:
    scrape_interval: 10s
    scrape_timeout: 5s

extraScrapeConfigs: |
  - job_name: 'bidbull-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bidbull-backend.bidbull.svc.cluster.local:8000']
        labels:
          app: 'bidbull-backend'
          environment: 'production'
